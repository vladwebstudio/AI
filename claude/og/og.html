<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geologica:slnt,wght,CRSV,SHRP@-12..0,100..900,0..1,0..100&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#E9EBE8;color:#121417;font-family:'Onest',sans-serif;position:relative}
.w{position:absolute;left:64px;top:52px;font:oblique 10deg 700 46px 'Geologica';font-variation-settings:"SHRP" 100,"CRSV" 1;letter-spacing:-.05em}
.w::after{content:".";color:#D93F22}
h1{position:absolute;left:64px;top:176px;width:560px;font:560 76px/1.02 'Geologica';font-variation-settings:"SHRP" 100;letter-spacing:-.03em}
p{position:absolute;left:64px;bottom:56px;width:520px;font-size:25px;line-height:1.35;color:#585D65;padding-left:18px;border-left:3px solid #D93F22}
.stage{position:absolute;left:640px;top:118px;width:640px;perspective:1500px}
.card{width:640px;aspect-ratio:1543/934;border-radius:14px;overflow:hidden;background:#0e1120;transform:rotateX(8deg) rotateY(-15deg) rotateZ(.8deg);box-shadow:0 0 0 1px rgba(18,20,23,.9),0 50px 80px -34px rgba(18,20,23,.6)}
.card img{width:100%;margin-top:-9.72%;display:block}
.mag{position:absolute;left:584px;top:176px;width:290px;height:290px}
.view{position:absolute;inset:0;border-radius:50%;background:#0e1120 url(../../img/hero-weak.webp) no-repeat;background-size:1420px auto;background-position:-52px -398px}
.ring{position:absolute;inset:0;border-radius:50%;border:8px solid #121417;box-shadow:0 40px 50px -18px rgba(0,0,0,.5),inset 0 0 0 2px #D93F22,inset 0 18px 30px -8px rgba(255,255,255,.5),inset 0 -22px 34px -12px rgba(18,20,23,.3)}
.ring::after{content:"";position:absolute;left:13%;top:9%;width:44%;height:26%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.5),transparent);transform:rotate(-28deg);opacity:.75}
.handle{position:absolute;left:50%;top:50%;width:20px;height:130px;margin-left:-10px;border-radius:0 0 12px 12px;background:#121417;transform-origin:50% 0;transform:rotate(-42deg) translateY(143px);box-shadow:0 26px 30px -10px rgba(0,0,0,.45)}
.handle::before{content:"";position:absolute;left:0;right:0;top:11px;height:7px;background:#D93F22}
</style></head><body>
<div class="w">чую</div>
<h1>Кожна розмова менеджера&nbsp;— під лупою</h1>
<p>ШІ-аналіз дзвінків для відділів продажів. Безкоштовний тест на 3 розмовах</p>
<div class="stage"><div class="card"><img src="../../img/hero-weak.webp"></div></div>
<div class="mag"><div class="view"></div><span class="handle"></span><span class="ring"></span></div>
</body></html>
